# Runs the self-tests and the lint on every push and pull request.
# The same checks run locally with:  npm install && npx playwright install --with-deps chromium && npm run lint && npm test
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Self-tests and every page
        run: npm test
