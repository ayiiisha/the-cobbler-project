<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-tests</title>
  <link rel="stylesheet" href="../resources/css/style.css">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#FAD39D">
  <script src="../resources/js/script.js"></script>
</head>
<body>

<!-- lz-string compresses saved projects (MIT licence, resources/vendor/lz-string/LICENSE.txt) -->
<script src="../resources/vendor/lz-string/lz-string-1.5.0.min.js"></script>
<script src="../resources/js/util.js"></script>
<script src="../resources/js/projects-core.js"></script>
<script src="../resources/js/header.js"></script>
<script src="../resources/js/color-themes.js"></script>
<script src="../resources/js/boot.js"
        data-scripts="project-ui.js comments.js file-store.js share.js sync.js undo.js account.js tests.js"></script>

<main class="is-wide">
  <h1>Self-tests</h1>
  <p class="media-tip">Checks the parts of the app that are easiest to break by accident: merging and syncing, undo, reading transcripts and markers, screenplay pages and more. Each test runs on made-up data in a sandbox, so your projects aren't touched. Run them after changing the code.</p>
  <div class="sketch-nav">
    <button type="button" class="small-btn" id="tests-run">Run all tests</button>
    <span class="tool-group" id="tests-summary" role="status"></span>
  </div>
  <ol class="test-list" id="tests-list"></ol>
</main>

</body>
</html>
