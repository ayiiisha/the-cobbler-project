<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>
  <link rel="stylesheet" href="../resources/css/style.css">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="theme-color" content="#FAD39D">
  <script src="../resources/js/script.js"></script>
</head>
<body>

<!-- lz-string compresses saved projects (MIT licence, resources/vendor/lz-string/LICENSE.txt) -->
<script src="../resources/vendor/lz-string/lz-string-1.5.0.min.js"></script>
<script src="../resources/js/util.js"></script>
<script src="../resources/js/projects-core.js"></script>
<script src="../resources/js/header.js"></script>
<script src="../resources/js/color-themes.js"></script>
<script src="../resources/js/boot.js"
        data-scripts="project-ui.js search.js comments.js file-store.js share.js sync.js backups.js undo.js account.js tour.js ideas-panel.js music-core.js music-songs.js music-business.js"></script>
<!-- abcjs draws sheet music from ABC notation (MIT licence, resources/vendor/abcjs/LICENSE.txt) -->
<script src="../resources/vendor/abcjs/abcjs-basic-6.4.4.min.js" defer></script>

<main class="is-wide">
  <h1>Music</h1>

  <div class="zine-tabs" id="mu-tabs" role="tablist" aria-label="Music">
    <button type="button" role="tab" id="mu-tab-songs" data-tab="songs" aria-controls="mu-panel" aria-selected="true">Songs</button>
    <button type="button" role="tab" id="mu-tab-gigs" data-tab="gigs" aria-controls="mu-panel" aria-selected="false">Gigs and bookings</button>
    <button type="button" role="tab" id="mu-tab-releases" data-tab="releases" aria-controls="mu-panel" aria-selected="false">Releases</button>
    <button type="button" role="tab" id="mu-tab-samples" data-tab="samples" aria-controls="mu-panel" aria-selected="false">Sample clearances</button>
  </div>
  <p class="media-status" id="mu-status" role="status"></p>
  <div class="zine-panel mu-panel" id="mu-panel" role="tabpanel" aria-labelledby="mu-tab-songs"></div>

  <div id="mu-print" class="print-sheet mu-print" aria-hidden="true"></div>
</main>

</body>
</html>
